name: hindu_calendar
description: Hindi-first, offline Hindu calendar with Panchang and personal Tithi events.
publish_to: 'none'
version: 1.0.0+18

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.3.2
  geolocator: ^14.1.1
  home_widget: ^0.9.2+1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/festival_overrides.json
    - assets/data/district_boundaries.json
    - assets/branding/app_icon.png
