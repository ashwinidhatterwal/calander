name: hindu_calendar
description: Hindi-first, offline Hindu calendar with Panchang and personal Tithi events.
publish_to: 'none'
version: 0.5.0+5

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/festival_overrides.json
