<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>दिन का विवरण</title><link rel="stylesheet" href="styles.css"></head><body><div class="app">
<header class="topbar"><div class="brand"><div class="brandmark">ॐ</div><div><h1 data-hi="दिन का विवरण" data-en="Day Details">दिन का विवरण</h1><small data-hi="श्रीगंगानगर, राजस्थान" data-en="Sri Ganganagar, Rajasthan">श्रीगंगानगर, राजस्थान</small></div></div><button class="lang" id="lang">EN</button></header>
<section class="dayhead"><a class="back" href="index.html" data-hi="‹ कैलेंडर पर वापस" data-en="‹ Back to calendar">‹ कैलेंडर पर वापस</a><div class="daytitle"><h1 id="dateTitle"></h1><p id="monthLine"></p></div><div class="tithihero"><div class="title" id="tithiTitle"></div><div class="ending" id="tithiEnd"></div><span class="pill" id="nextTithi"></span></div></section>
<section class="cards" id="cards"></section>
<nav class="bottom"><div class="nav active"><span>▦</span><i data-hi="कैलेंडर" data-en="Calendar">कैलेंडर</i></div><div class="nav"><span>✦</span><i data-hi="त्योहार" data-en="Festivals">त्योहार</i></div><div class="nav"><span>⌕</span><i data-hi="खोज" data-en="Search">खोज</i></div><div class="nav"><span>⚙</span><i data-hi="सेटिंग्स" data-en="Settings">सेटिंग्स</i></div></nav>
</div><script src="data.js"></script><script>
let lang=localStorage.getItem('hc-lang')||'hi';let key=new URLSearchParams(location.search).get('date')||'2026-09-27';let x=PANCHANG_DATA[key]||PANCHANG_DATA['2026-09-27'];
const monthsHi=['जनवरी','फ़रवरी','मार्च','अप्रैल','मई','जून','जुलाई','अगस्त','सितंबर','अक्टूबर','नवंबर','दिसंबर'];const monthsEn=['January','February','March','April','May','June','July','August','September','October','November','December'];
function row(a,b){return `<div class="row"><span>${a}</span><b>${b??'—'}</b></div>`}function tr(){document.documentElement.lang=lang;document.querySelectorAll('[data-hi]').forEach(n=>n.textContent=n.dataset[lang]);document.getElementById('lang').textContent=lang==='hi'?'EN':'हि';render()}
function festivalCards(){if(!x.observances.length)return `<b>${lang==='hi'?'आज कोई प्रमुख पर्व या व्रत चिन्हित नहीं है।':'No major festival or vrat is marked today.'}</b>`;return x.observances.map(o=>`<div class="festivalitem"><b>${o[lang]}</b>${o.basis_time?`<small>${lang==='hi'?'संदर्भ समय':'Reference time'}: ${o.basis_time}</small>`:''}${o['notes_'+lang]?`<p class="note">${o['notes_'+lang]}</p>`:''}</div>`).join('')}
function render(){let d=new Date(key+'T12:00:00');let m=lang==='hi'?monthsHi[d.getMonth()]:monthsEn[d.getMonth()];document.getElementById('dateTitle').textContent=`${x['weekday_'+lang]}, ${d.getDate()} ${m} ${d.getFullYear()}`;document.getElementById('monthLine').textContent=`${x.month[lang]} ${lang==='hi'?'मास':'month'} • ${lang==='hi'?'विक्रम संवत':'Vikram Samvat'} ${x.vikram}`;document.getElementById('tithiTitle').textContent=`${x.paksha[lang]} ${x.tithi[lang]}`;document.getElementById('tithiEnd').textContent=`${lang==='hi'?'तिथि समाप्त':'Tithi ends'} ${x.tithi_end}`;document.getElementById('nextTithi').textContent=`${lang==='hi'?'इसके बाद':'Next'}: ${x.next_tithi[lang]}`;
let anomaly='';if(x.tithi_status==='kshaya'&&x.skipped_tithi){anomaly=`<div class="alert">${lang==='hi'?`सूर्योदय के बीच ${x.skipped_tithi.hi} क्षय तिथि है।`:`${x.skipped_tithi.en} is skipped between successive sunrises.`}</div>`}else if(x.tithi_status==='vriddhi'){anomaly=`<div class="alert">${lang==='hi'?'यह तिथि दो लगातार सूर्योदय पर रहती है (वृद्धि तिथि)।':'This Tithi prevails at two consecutive sunrises (Vriddhi Tithi).'}</div>`}
document.getElementById('cards').innerHTML=`
${anomaly}
<div class="card"><h3>${lang==='hi'?'दिन की मुख्य जानकारी':'Day overview'}</h3><div class="rows">${row(lang==='hi'?'मास':'Month',x.month[lang])}${row(lang==='hi'?'पक्ष':'Paksha',x.paksha[lang])}${row(lang==='hi'?'नक्षत्र':'Nakshatra',x.nakshatra[lang]+' • '+x.nakshatra_end)}${row(lang==='hi'?'योग':'Yoga',x.yoga[lang]+' • '+x.yoga_end)}${row(lang==='hi'?'करण':'Karana',x.karana[lang]+' • '+x.karana_end)}</div></div>
<div class="card"><h3>${lang==='hi'?'आज के पर्व / व्रत':'Festivals / Vrat'}</h3>${festivalCards()}</div>
<div class="card"><h3>${lang==='hi'?'सूर्य और चंद्र':'Sun & Moon'}</h3><div class="twocol"><div class="mini"><small>${lang==='hi'?'सूर्योदय':'Sunrise'}</small><b>${x.sunrise}</b></div><div class="mini"><small>${lang==='hi'?'सूर्यास्त':'Sunset'}</small><b>${x.sunset}</b></div><div class="mini"><small>${lang==='hi'?'चंद्रोदय':'Moonrise'}</small><b>${x.moonrise??'—'}</b></div><div class="mini"><small>${lang==='hi'?'चंद्रास्त':'Moonset'}</small><b>${x.moonset??'—'}</b></div></div><div class="rows" style="margin-top:12px">${row(lang==='hi'?'सूर्य राशि':'Sun sign',x.sun_rashi[lang])}${row(lang==='hi'?'चंद्र राशि':'Moon sign',x.moon_rashi[lang])}</div></div>
<div class="card"><h3>${lang==='hi'?'शुभ समय':'Useful timings'}</h3><div class="rows">${row(lang==='hi'?'अभिजीत मुहूर्त':'Abhijit Muhurta',x.abhijit)}${row(lang==='hi'?'ब्रह्म मुहूर्त':'Brahma Muhurta',x.brahma)}</div></div>
<div class="card"><h3>${lang==='hi'?'सावधानी के समय':'Caution periods'}</h3><div class="rows">${row(lang==='hi'?'राहुकाल':'Rahu Kalam',x.rahu)}${row(lang==='hi'?'यमगण्ड':'Yamaganda',x.yamaganda)}${row(lang==='hi'?'गुलिक काल':'Gulika',x.gulika)}</div></div>
<div class="card"><h3>${lang==='hi'?'कैलेंडर संदर्भ':'Calendar reference'}</h3><div class="rows">${row(lang==='hi'?'विक्रम संवत':'Vikram Samvat',x.vikram)}${row(lang==='hi'?'शक संवत':'Shaka Samvat',x.shaka)}${row(lang==='hi'?'अमांत मास':'Amanta month',x.amanta_month[lang])}${x.adhik?row(lang==='hi'?'अधिक मास':'Adhik month',lang==='hi'?'हाँ':'Yes'):''}${x.kshaya_month_after?row(lang==='hi'?'क्षय मास':'Kshaya month',x.kshaya_month_after[lang]):''}</div></div>`}
document.getElementById('lang').onclick=()=>{lang=lang==='hi'?'en':'hi';localStorage.setItem('hc-lang',lang);tr()};tr();
</script></body></html>
