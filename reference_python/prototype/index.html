<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>हिन्दू कैलेंडर</title><link rel="stylesheet" href="styles.css"></head><body><div class="app">
<header class="topbar"><div class="brand"><div class="brandmark">ॐ</div><div><h1 data-hi="हिन्दू कैलेंडर" data-en="Hindu Calendar">हिन्दू कैलेंडर</h1><small data-hi="श्रीगंगानगर, राजस्थान" data-en="Sri Ganganagar, Rajasthan">श्रीगंगानगर, राजस्थान</small></div></div><button class="lang" id="lang">EN</button></header>
<section class="hero" id="todayCard"></section>
<section class="monthbar"><div><h2 data-hi="सितंबर 2026" data-en="September 2026">सितंबर 2026</h2><p data-hi="भाद्रपद • आश्विन" data-en="Bhadrapada • Ashwin">भाद्रपद • आश्विन</p></div><div class="monthnav"><button class="iconbtn">‹</button><button class="iconbtn">›</button></div></section>
<section class="calendar"><div class="weekdays" id="weekdays"></div><div class="grid" id="grid"></div></section>
<a class="next" href="day.html?date=2026-09-27"><div><small data-hi="आज का पूरा विवरण" data-en="Full details for today">आज का पूरा विवरण</small><b id="nextText">कृष्ण प्रतिपदा • आश्विन</b></div><div class="arrow">›</div></a>
<nav class="bottom"><div class="nav active"><span>▦</span><i data-hi="कैलेंडर" data-en="Calendar">कैलेंडर</i></div><div class="nav"><span>✦</span><i data-hi="त्योहार" data-en="Festivals">त्योहार</i></div><div class="nav"><span>⌕</span><i data-hi="खोज" data-en="Search">खोज</i></div><div class="nav"><span>⚙</span><i data-hi="सेटिंग्स" data-en="Settings">सेटिंग्स</i></div></nav>
</div><script src="data.js"></script><script>
let lang=localStorage.getItem('hc-lang')||'hi';
const W={hi:['रवि','सोम','मंगल','बुध','गुरु','शुक्र','शनि'],en:['Sun','Mon','Tue','Wed','Thu','Fri','Sat']};
function tr(){document.documentElement.lang=lang;document.querySelectorAll('[data-hi]').forEach(x=>x.textContent=x.dataset[lang]);document.getElementById('lang').textContent=lang==='hi'?'EN':'हि';render();}
function render(){let wk=document.getElementById('weekdays');wk.innerHTML=W[lang].map(x=>`<div>${x}</div>`).join('');let grid=document.getElementById('grid');grid.innerHTML='';let d=new Date('2026-08-30T12:00:00');for(let i=0;i<42;i++){let key=d.toISOString().slice(0,10),x=PANCHANG_DATA[key];let a=document.createElement('a');a.href=`day.html?date=${key}`;a.className='cell '+(d.getMonth()!==8?'other ':'')+(key==='2026-09-27'?'today':'');let obs=x.observances[0];a.innerHTML=`<div class="num">${x.day}</div><div class="tithi">${x.tithi[lang]}</div>${obs?`<div class="badge">${obs[lang]}</div>`:''}`;grid.appendChild(a);d.setDate(d.getDate()+1)}let t=PANCHANG_DATA['2026-09-27'];document.getElementById('todayCard').innerHTML=`<div class="eyebrow">${lang==='hi'?'आज • रविवार, 27 सितंबर':'Today • Sunday, 27 September'}</div><div class="big">${t.paksha[lang]} ${t.tithi[lang]}</div><div class="sub">${t.month[lang]} ${lang==='hi'?'मास':'month'}</div><div class="meta"><div>${lang==='hi'?'सूर्योदय':'Sunrise'}<b>${t.sunrise}</b></div><div>${lang==='hi'?'सूर्यास्त':'Sunset'}<b>${t.sunset}</b></div><div>${lang==='hi'?'तिथि समाप्त':'Tithi ends'}<b>${t.tithi_end}</b></div></div>`;document.getElementById('nextText').textContent=`${t.paksha[lang]} ${t.tithi[lang]} • ${t.month[lang]}`;}
document.getElementById('lang').onclick=()=>{lang=lang==='hi'?'en':'hi';localStorage.setItem('hc-lang',lang);tr()};tr();
</script></body></html>
