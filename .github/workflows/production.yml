name: Production Play bundle

on:
  workflow_dispatch:

jobs:
  production-bundle:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Check required release secrets
        shell: bash
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          SUPPORT_UPI_ID: ${{ secrets.SUPPORT_UPI_ID }}
          SUPPORT_EMAIL: ${{ secrets.SUPPORT_EMAIL }}
          SUPPORT_PAYEE_NAME: ${{ secrets.SUPPORT_PAYEE_NAME }}
        run: |
          set -euo pipefail
          missing=0
          for name in UPLOAD_KEYSTORE_BASE64 UPLOAD_STORE_PASSWORD UPLOAD_KEY_ALIAS UPLOAD_KEY_PASSWORD SUPPORT_UPI_ID SUPPORT_PAYEE_NAME SUPPORT_EMAIL; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi

      - name: Create Android platform scaffold
        shell: bash
        run: bash ../tools/prepare_android_scaffold.sh

      - name: Install packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test calculation, UI and personal-calendar logic
        run: flutter test

      - name: Validate production-source structure
        working-directory: .
        run: |
          python tools/validate_checkpoint17.py
          python tools/test_permission_audit.py

      - name: Configure upload-key signing
        shell: bash
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<PROPS
          storePassword=$UPLOAD_STORE_PASSWORD
          keyPassword=$UPLOAD_KEY_PASSWORD
          keyAlias=$UPLOAD_KEY_ALIAS
          storeFile=$(pwd)/android/app/upload-keystore.jks
          PROPS
          python ../tools/configure_android_signing.py

      - name: Build signed production AAB
        env:
          SUPPORT_UPI_ID: ${{ secrets.SUPPORT_UPI_ID }}
          SUPPORT_PAYEE_NAME: ${{ secrets.SUPPORT_PAYEE_NAME }}
          SUPPORT_EMAIL: ${{ secrets.SUPPORT_EMAIL }}
        run: |
          flutter build appbundle --release --obfuscate --split-debug-info=build/symbols \
            --dart-define=SUPPORT_UPI_ID="$SUPPORT_UPI_ID" \
            --dart-define=SUPPORT_PAYEE_NAME="$SUPPORT_PAYEE_NAME" \
            --dart-define=SUPPORT_EMAIL="$SUPPORT_EMAIL"

      # This generated Android host exposes debug unit tests. The release AAB
      # is built above and audited/signed below; do not request a missing task.
      - name: Test native notification delivery and recovery
        run: cd android && ./gradlew app:testDebugUnitTest

      - name: Audit production bundle permissions
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://github.com/google/bundletool/releases/download/1.18.2/bundletool-all-1.18.2.jar -o /tmp/bundletool.jar
          java -jar /tmp/bundletool.jar dump manifest --bundle=build/app/outputs/bundle/release/app-release.aab --module=base > build/release-manifest.xml
          python ../tools/audit_android_permissions.py build/release-manifest.xml

      - name: Verify AAB signature
        shell: bash
        run: jarsigner -verify -certs build/app/outputs/bundle/release/app-release.aab

      - name: Upload Play bundle
        uses: actions/upload-artifact@v4
        with:
          name: hindu-calendar-1.0.0-build17-play-aab
          path: flutter_app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload Dart symbols
        uses: actions/upload-artifact@v4
        with:
          name: hindu-calendar-1.0.0-build17-dart-symbols
          path: flutter_app/build/symbols/**
          if-no-files-found: error
