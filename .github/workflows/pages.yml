name: Privacy policy site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'store_web/**'
      - '.github/workflows/pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build privacy site
        env:
          SUPPORT_EMAIL: ${{ secrets.SUPPORT_EMAIL }}
        run: |
          set -euo pipefail
          mkdir -p _site
          cp store_web/privacy.html _site/index.html
          python - <<'PY'
          import os
          from pathlib import Path
          p = Path('_site/index.html')
          s = p.read_text(encoding='utf-8')
          email = os.environ.get('SUPPORT_EMAIL','').strip()
          replacement = email if email else 'the developer contact email shown on the Google Play listing'
          p.write_text(s.replace('{{SUPPORT_EMAIL}}', replacement), encoding='utf-8')
          PY
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
