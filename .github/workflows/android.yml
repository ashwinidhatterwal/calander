name: Android QA build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'flutter_app/**'
      - 'tools/**'
      - '.github/workflows/android.yml'

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Create Android platform scaffold
        shell: bash
        run: bash ../tools/prepare_android_scaffold.sh

      - name: Verify native widget package
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'package `in`.hinducalendar.hindu_calendar' android_widget/kotlin/TodayPanchangWidgetProvider.kt
          grep -F 'package `in`.hinducalendar.hindu_calendar' android_widget/kotlin/UpcomingWidgetProvider.kt

      - name: Install packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test calculation, UI and personal-calendar logic
        run: flutter test

      - name: Validate production-source structure
        working-directory: .
        run: |
          python tools/validate_checkpoint14.py
          python tools/test_permission_audit.py

      - name: Build QA release APK
        env:
          SUPPORT_UPI_ID: ${{ secrets.SUPPORT_UPI_ID }}
          SUPPORT_PAYEE_NAME: ${{ secrets.SUPPORT_PAYEE_NAME }}
          SUPPORT_EMAIL: ${{ secrets.SUPPORT_EMAIL }}
        run: |
          flutter build apk --release \
            --dart-define=SUPPORT_UPI_ID="$SUPPORT_UPI_ID" \
            --dart-define=SUPPORT_PAYEE_NAME="$SUPPORT_PAYEE_NAME" \
            --dart-define=SUPPORT_EMAIL="$SUPPORT_EMAIL"

      - name: Test native notification delivery and recovery
        run: cd android && ./gradlew app:testDebugUnitTest

      - name: Verify target API level
        shell: bash
        run: |
          set -euo pipefail
          tool="$(find "$ANDROID_SDK_ROOT" -type f -name apkanalyzer 2>/dev/null | head -n 1 || true)"
          if [ -z "$tool" ]; then
            echo "::warning::apkanalyzer not found; target API verification skipped"
            exit 0
          fi
          target="$($tool manifest target-sdk build/app/outputs/flutter-apk/app-release.apk | grep -oE '[0-9]+' | head -n1)"
          echo "Target SDK: $target"
          appid="$($tool manifest application-id build/app/outputs/flutter-apk/app-release.apk)"
          version="$($tool manifest version-code build/app/outputs/flutter-apk/app-release.apk)"
          [ "$appid" = "in.hinducalendar.hindu_calendar" ]
          [ "$version" = "14" ]
          if [ "$target" -lt 36 ]; then
            echo "::error::Google Play requires target API 36+ for new apps as of Aug 31, 2026"
            exit 1
          fi

      - name: Audit Android permissions
        shell: bash
        run: |
          set -euo pipefail
          tool="$(find "$ANDROID_SDK_ROOT" -type f -name apkanalyzer 2>/dev/null | head -n 1 || true)"
          if [ -z "$tool" ]; then
            echo "::error::apkanalyzer missing; cannot audit release permissions"
            exit 1
          fi
          "$tool" manifest permissions build/app/outputs/flutter-apk/app-release.apk > build/release-permissions.txt
          python ../tools/audit_android_permissions.py build/release-permissions.txt

      - name: Upload QA APK
        uses: actions/upload-artifact@v4
        with:
          name: hindu-calendar-1.0.0-build14-qa-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
